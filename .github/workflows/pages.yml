name: Deploy game to GitHub Pages

# Publishes the standalone build (game/) as a static site. The game is pure
# static files, so there is no build step — we just upload game/ as the Pages
# artifact and deploy it. Serving via Actions (not "deploy from branch") means
# no Jekyll processing, so .mjs modules are served as-is.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer run supersede an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./game
      - id: deployment
        uses: actions/deploy-pages@v4
