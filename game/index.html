<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="icon" href="data:," />
  <title>Singularity Museum</title>
  <style>
    :root { --accent: #ffcf5a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0d10; }
    body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #eee; cursor: default; }
    #app { position: fixed; inset: 0; display: block; }

    /* Crosshair */
    #crosshair {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 24px; height: 24px; pointer-events: none; opacity: 0.9; display: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ""; position: absolute; background: rgba(255,255,255,0.85);
      box-shadow: 0 0 2px rgba(0,0,0,0.8);
    }
    #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
    #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
    #dot {
      position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; border-radius: 50%;
      background: var(--accent); transform: translate(-50%,-50%); pointer-events: none; display: none; z-index: 11;
      box-shadow: 0 0 3px rgba(0,0,0,0.9);
    }

    /* HUD */
    #hud {
      position: fixed; inset: 0; pointer-events: none; z-index: 9; display: none;
    }
    #ammo {
      position: fixed; right: 32px; bottom: 24px; text-align: right;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    #ammo .count { font-size: 44px; font-weight: 700; letter-spacing: 1px; }
    #ammo .count .reserve { font-size: 22px; opacity: 0.6; font-weight: 500; }
    #score {
      position: fixed; left: 32px; bottom: 24px; font-size: 14px; letter-spacing: 1px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    #score b { color: var(--accent); font-size: 22px; }
    #reloading {
      position: fixed; left: 50%; top: 58%; transform: translateX(-50%);
      font-size: 14px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8); display: none;
    }
    #hitmarker {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(45deg);
      width: 18px; height: 18px; pointer-events: none; opacity: 0; z-index: 12;
    }
    #hitmarker::before, #hitmarker::after { content:""; position:absolute; background:#fff; }
    #hitmarker::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
    #hitmarker::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

    /* Action hints — an E over every prop in reach (see src/actions.mjs), which
       places each one with a transform. The one the key would act on is lit;
       the rest are there to say "this one too, if you look at it". */
    #actions { position: fixed; inset: 0; pointer-events: none; z-index: 9; overflow: hidden; }
    .action-hint {
      /* Laid out from the key's centre: the transform puts this box's origin on
         the point, and the margins pull the 26 px key back over it. */
      position: absolute; left: 0; top: 0; margin: -13px 0 0 -13px;
      display: flex; align-items: center; gap: 8px;
      white-space: nowrap; opacity: 0.55; will-change: transform;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8); transition: opacity 0.12s ease;
    }
    /* Pinned to the right-hand edge: the word goes left of the key, and the box
       is hung from its right end so the key stays where it was put. */
    .action-hint.flipped { flex-direction: row-reverse; left: auto; right: 100%; margin: -13px -13px 0 0; }
    .action-hint .key {
      display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px;
      font: 700 14px/1 ui-monospace, monospace; color: #fff;
      background: rgba(12,14,18,0.55); border: 1.5px solid rgba(255,255,255,0.55);
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease, transform 0.12s ease;
    }
    .action-hint .label { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
    .action-hint.active { opacity: 1; }
    .action-hint.active .key {
      color: #1a140a; background: var(--accent); border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255,207,90,0.25), 0 4px 14px rgba(255,207,90,0.45);
      transform: scale(1.15);
    }
    .action-hint.active .label { color: var(--accent); }
    /* Slid to the edge of the screen: what it belongs to is beside or behind you. */
    .action-hint.pinned .label { opacity: 0.7; }

    /* Start / pause overlay */
    #overlay {
      position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      background: radial-gradient(ellipse at center, rgba(12,14,18,0.72), rgba(8,9,12,0.94));
      backdrop-filter: blur(2px);
    }
    #overlay h1 {
      font-size: 52px; font-weight: 800; letter-spacing: 2px; margin-bottom: 6px;
      background: linear-gradient(180deg, #fff 0%, var(--accent) 120%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    #overlay .sub { opacity: 0.7; font-size: 15px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 36px; }
    #overlay .play {
      pointer-events: auto; cursor: pointer; border: none; border-radius: 8px;
      padding: 16px 44px; font-size: 18px; font-weight: 700; letter-spacing: 1px;
      color: #1a140a; background: var(--accent); box-shadow: 0 10px 30px rgba(255,207,90,0.25);
      transition: transform 0.08s ease, box-shadow 0.2s ease;
    }
    #overlay .play:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(255,207,90,0.4); }
    #overlay .controls {
      margin-top: 40px; display: grid; grid-template-columns: auto auto; gap: 8px 18px;
      font-size: 14px; opacity: 0.8;
    }
    #overlay .controls .k {
      justify-self: end; font-family: ui-monospace, monospace; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 5px; padding: 2px 9px; font-size: 12px;
    }
    #overlay .controls .d { justify-self: start; }
    /* Which game Play enters. Picked again while paused, it switches game in
       the same world, from where you are (see src/main.mjs switchMode). */
    #modes { display: flex; gap: 8px; margin-bottom: 18px; }
    #modes button {
      pointer-events: auto; cursor: pointer; border-radius: 6px; padding: 6px 14px;
      font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: #eee; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2);
    }
    #modes button:hover { border-color: var(--accent); color: var(--accent); }
    #modes button.picked { color: #1a140a; background: var(--accent); border-color: var(--accent); }
    /* What shows while playing: the dot (where E and the view point), the
       crosshair and the HUD, all in the shooter only. main.mjs sets the
       classes and data-mode; no game touches these elements' display itself. */
    body.playing[data-mode="shooter"] #dot { display: block; }
    body.playing[data-mode="shooter"] #crosshair { display: block; }
    body.started[data-mode="shooter"] #hud { display: block; }
    /* A question an object's script puts to the player (object.menu — see
       page.menu in src/main.mjs): this same screen, with only the question
       and its buttons on it. The first button is the one in the accent. */
    #ask { display: none; max-width: 600px; padding: 0 24px; }
    #overlay.asking > :not(#ask) { display: none; }
    #overlay.asking #ask { display: block; }
    #askText { font-size: 20px; line-height: 1.5; margin-bottom: 34px; }
    #askButtons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    #askButtons .play + .play {
      color: #eee; background: rgba(255,255,255,0.06); box-shadow: none;
      outline: 1px solid rgba(255,255,255,0.25); outline-offset: -1px;
    }
    #askButtons .play + .play:hover { color: var(--accent); outline-color: var(--accent); box-shadow: none; }
    /* Load status (see showLoad in src/main.mjs): the phase line, a bar —
       sweeping while the map downloads, filling as the objects are placed —
       and what is still coming. The bar goes once everything has landed. */
    #loadStatus { margin-top: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    #loading { font-size: 13px; letter-spacing: 2px; opacity: 0.6; }
    #loadBar {
      position: relative; overflow: hidden; width: 220px; height: 3px; border-radius: 2px;
      background: rgba(255,255,255,0.12);
    }
    #loadBar i {
      position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent);
      transition: width 0.25s ease;
    }
    #loadBar.sweep i { width: 30%; transition: none; animation: loadSweep 1.2s ease-in-out infinite; }
    @keyframes loadSweep { from { left: -30%; } to { left: 100%; } }
    #loadBar.done { display: none; }
    #loadDetail { font-size: 12px; letter-spacing: 1px; opacity: 0.5; }
    #loadDetail:empty { display: none; }
    #people { margin-top: 8px; font-size: 13px; letter-spacing: 2px; opacity: 0.6; }
    #people:empty { display: none; }
    /* The pause screen's own settings, and the view as it stands: one line of
       where the eye is and where it looks, and a link that opens on it. */
    #prefs { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 13px; }
    #prefs label { pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 8px; opacity: 0.85; }
    #prefs input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
    #view { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
    #viewText {
      font-family: ui-monospace, monospace; font-size: 12px; opacity: 0.8; user-select: text; pointer-events: auto;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 5px; padding: 4px 10px;
    }
    #viewCopy {
      pointer-events: auto; cursor: pointer; border-radius: 5px; padding: 4px 12px;
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: #eee; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2);
    }
    #viewCopy:hover { border-color: var(--accent); color: var(--accent); }
    /* What an Instagram shot (9:16, full height) keeps of this screen: the
       middle, with the sides dimmed. The game's field of view is vertical, so
       a 1080x1920 recording from here (tools/record.mjs) shows exactly the
       bright part. Above the hints, below the pause screen. */
    #igFrame {
      position: fixed; top: 0; left: 50%; height: 100vh; aspect-ratio: 9 / 16; transform: translateX(-50%);
      box-shadow: 0 0 0 100vmax rgba(0,0,0,0.6); outline: 1px solid rgba(255,255,255,0.25);
      pointer-events: none; z-index: 15; display: none;
    }
    body.igframe #igFrame { display: block; }

    /* A shot played live (?shot=): the picture, the frame the shot keeps with
       everything outside it all but dark, and a card to start it — nothing of
       the game's own screens. */
    body.shot #overlay, body.shot #actions, body.shot #crosshair, body.shot #dot,
    body.shot #hud, body.shot #hitmarker { display: none !important; }
    body.shot #igFrame { display: block; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.88); outline: none; }
    body.shot-playing, body.shot-playing * { cursor: none !important; }
    #shotCard {
      position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%); z-index: 30;
      display: none; flex-direction: column; align-items: center; gap: 12px;
      padding: 16px 22px; border-radius: 10px; background: rgba(10,10,12,0.82);
      border: 1px solid rgba(255,255,255,0.12); font-size: 13px; letter-spacing: 1px;
    }
    body.shot #shotCard { display: flex; }
    body.shot-playing #shotCard { display: none; }
    #shotPlay {
      pointer-events: auto; cursor: pointer; border: none; border-radius: 8px; padding: 10px 26px;
      font-size: 15px; font-weight: 700; background: var(--accent); color: #111;
    }
    #shotPlay:disabled { opacity: 0.4; cursor: default; }
    .hidden { display: none !important; }

    /* Debug mode (?debug): pausing is something you do to reach the tweak panel,
       not to read a menu — so the overlay stops dimming the scene you are
       tweaking, shrinks to a corner resume button (clear of the panel, which
       sits top-right), and keeps only the ready line at the foot. */
    body.debug #overlay {
      background: none; backdrop-filter: none;
      align-items: flex-start; justify-content: flex-start;
    }
    body.debug #overlay h1,
    body.debug #overlay .sub,
    body.debug #overlay .controls,
    body.debug #prefs,
    body.debug #igFrame,
    body.debug #people { display: none; }
    body.debug #overlay .play {
      margin: 12px; padding: 8px 22px; font-size: 9px; border-radius: 4px;
      box-shadow: 0 5px 15px rgba(255,207,90,0.25);
    }
    /* A question is asked the same in debug: in the middle, over a dim. */
    body.debug #overlay.asking {
      align-items: center; justify-content: center; background: rgba(8,9,12,0.8);
    }
    body.debug #loadStatus {
      position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
      margin: 0; white-space: nowrap;
      /* No dim behind it any more, so it reads off the HUD's shadow instead. */
      opacity: 0.85; text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    /* The debug tweak panel brings its own CSS and its own markup (see
       src/debug.mjs); this page is the production one and carries neither. */
  </style>
</head>
<body>
  <canvas id="app"></canvas>

  <div id="crosshair"></div>
  <div id="dot"></div>
  <div id="hitmarker"></div>
  <div id="actions"></div>
  <div id="igFrame"></div>
  <div id="shotCard"><span id="shotText"></span><button type="button" id="shotPlay" disabled>Loading…</button></div>

  <div id="hud">
    <div id="score">SCORE <b id="scoreVal">0</b></div>
    <div id="reloading">Reloading…</div>
    <div id="ammo">
      <div class="count"><span id="mag">30</span><span class="reserve"> / <span id="reserve">90</span></span></div>
    </div>
  </div>

  <div id="overlay">
    <h1 id="title">Singularity Museum</h1>
    <div class="sub" id="sub">History of the future</div>
    <div id="modes"></div>
    <button class="play" id="playBtn" disabled>Loading…</button>
    <div id="loadStatus">
      <div id="loading">Preparing map…</div>
      <div id="loadBar" class="sweep"><i></i></div>
      <div id="loadDetail"></div>
    </div>
    <div class="controls" id="controls"></div>
    <div id="prefs">
      <label><input type="checkbox" id="hintsToggle" checked> Show E hints</label>
      <label><input type="checkbox" id="igToggle"> Instagram frame (9:16)</label>
      <div id="view">
        <span id="viewText" title="Eye position x, y, z · look yaw, pitch"></span>
        <button type="button" id="viewCopy" title="Copy a link that opens on this view">Copy link</button>
      </div>
    </div>
    <div id="people"></div>
    <div id="ask">
      <p id="askText"></p>
      <div id="askButtons"></div>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "playcanvas": "./lib/playcanvas.mjs" } }
  </script>
  <script type="module" src="./src/main.mjs"></script>
</body>
</html>
