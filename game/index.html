<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="icon" href="data:," />
  <title>de_dust2 — PlayCanvas FPS</title>
  <style>
    :root { --accent: #ffcf5a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0d10; }
    body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #eee; cursor: default; }
    #app { position: fixed; inset: 0; display: block; }

    /* Crosshair */
    #crosshair {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 24px; height: 24px; pointer-events: none; opacity: 0.9; display: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: ""; position: absolute; background: rgba(255,255,255,0.85);
      box-shadow: 0 0 2px rgba(0,0,0,0.8);
    }
    #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
    #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
    #dot {
      position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; border-radius: 50%;
      background: var(--accent); transform: translate(-50%,-50%); pointer-events: none; display: none; z-index: 11;
      box-shadow: 0 0 3px rgba(0,0,0,0.9);
    }

    /* HUD */
    #hud {
      position: fixed; inset: 0; pointer-events: none; z-index: 9; display: none;
    }
    #ammo {
      position: fixed; right: 32px; bottom: 24px; text-align: right;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    #ammo .count { font-size: 44px; font-weight: 700; letter-spacing: 1px; }
    #ammo .count .reserve { font-size: 22px; opacity: 0.6; font-weight: 500; }
    #ammo .name { font-size: 13px; letter-spacing: 3px; opacity: 0.7; text-transform: uppercase; }
    #score {
      position: fixed; left: 32px; bottom: 24px; font-size: 14px; letter-spacing: 1px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    #score b { color: var(--accent); font-size: 22px; }
    #reloading {
      position: fixed; left: 50%; top: 58%; transform: translateX(-50%);
      font-size: 14px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8); display: none;
    }
    #hitmarker {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%) rotate(45deg);
      width: 18px; height: 18px; pointer-events: none; opacity: 0; z-index: 12;
    }
    #hitmarker::before, #hitmarker::after { content:""; position:absolute; background:#fff; }
    #hitmarker::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
    #hitmarker::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

    /* Start / pause overlay */
    #overlay {
      position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      background: radial-gradient(ellipse at center, rgba(12,14,18,0.72), rgba(8,9,12,0.94));
      backdrop-filter: blur(2px);
    }
    #overlay h1 {
      font-size: 52px; font-weight: 800; letter-spacing: 2px; margin-bottom: 6px;
      background: linear-gradient(180deg, #fff 0%, var(--accent) 120%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    #overlay .sub { opacity: 0.7; font-size: 15px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 36px; }
    #overlay .play {
      pointer-events: auto; cursor: pointer; border: none; border-radius: 8px;
      padding: 16px 44px; font-size: 18px; font-weight: 700; letter-spacing: 1px;
      color: #1a140a; background: var(--accent); box-shadow: 0 10px 30px rgba(255,207,90,0.25);
      transition: transform 0.08s ease, box-shadow 0.2s ease;
    }
    #overlay .play:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(255,207,90,0.4); }
    #overlay .controls {
      margin-top: 40px; display: grid; grid-template-columns: auto auto; gap: 8px 18px;
      font-size: 14px; opacity: 0.8;
    }
    #overlay .controls .k {
      justify-self: end; font-family: ui-monospace, monospace; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 5px; padding: 2px 9px; font-size: 12px;
    }
    #overlay .controls .d { justify-self: start; }
    #loading { margin-top: 28px; font-size: 13px; letter-spacing: 2px; opacity: 0.6; }
    .hidden { display: none !important; }

    /* The debug tweak panel brings its own CSS and its own markup (see
       src/debug.mjs); this page is the production one and carries neither. */
  </style>
</head>
<body>
  <canvas id="app"></canvas>

  <div id="crosshair"></div>
  <div id="dot"></div>
  <div id="hitmarker"></div>

  <div id="hud">
    <div id="score">SCORE <b id="scoreVal">0</b></div>
    <div id="reloading">Reloading…</div>
    <div id="ammo">
      <div class="count"><span id="mag">30</span><span class="reserve"> / <span id="reserve">90</span></span></div>
      <div class="name">AK · de_dust2</div>
    </div>
  </div>

  <div id="overlay">
    <h1>DE_DUST2</h1>
    <div class="sub">PlayCanvas · First-Person Shooter</div>
    <button class="play" id="playBtn" disabled>Loading…</button>
    <div class="controls">
      <span class="k">W A S D</span><span class="d">Move</span>
      <span class="k">Mouse</span><span class="d">Look</span>
      <span class="k">L-Click</span><span class="d">Shoot</span>
      <span class="k">Shift</span><span class="d">Sprint</span>
      <span class="k">Space</span><span class="d">Jump</span>
      <span class="k">R</span><span class="d">Reload</span>
      <span class="k">T</span><span class="d">Teleport to new spawn</span>
      <span class="k">Esc</span><span class="d">Release mouse</span>
    </div>
    <div id="loading">Preparing map…</div>
  </div>

  <script type="importmap">
    { "imports": { "playcanvas": "./lib/playcanvas.mjs" } }
  </script>
  <script type="module" src="./standalone/main.mjs"></script>
</body>
</html>
